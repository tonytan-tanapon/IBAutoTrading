    const width = 1200;

    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

    const values = [];

      values.push(row.high, row.low);
      for (const key of ["longLevel", "shortLevel", "atrUp", "atrDn", "openingHigh", "openingLow", "entry", "stop", "target"]) {

      }

    const pad = Math.max((maxValue - minValue) * 0.08, 0.5);

    function x(index) {

      return margin.top + (yMax - value) / (yMax - yMin) * plotHeight;
